[project]
name = "cineops-guardian"
version = "2.3.0"
description = "Observability and AI Agent Incident Investigation for Virtual Production and Robotic Cameras"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Chenghao Quan", email = "chquan17@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-genai>=0.1.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.16.0",
    "mcap>=1.1.1",
    "httpx>=0.27.0",
    "mcp>=1.29.0",
    "Pillow>=10.1.0",
    "sse-starlette>=2.1.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
